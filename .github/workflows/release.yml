name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SOULBROU_KEYSTORE: ${{ secrets.SOULBROU_KEYSTORE }}
        run: |
          if [ -z "$SOULBROU_KEYSTORE" ]; then
            echo "SOULBROU_KEYSTORE secret not set; falling back to the debug signature."
            exit 0
          fi
          echo "$SOULBROU_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/soulbrou-release.p12"

      - name: Build signed release APK
        env:
          SOULBROU_KEYSTORE: ${{ runner.temp }}/soulbrou-release.p12
          SOULBROU_KEYSTORE_PASSWORD: ${{ secrets.SOULBROU_KEYSTORE_PASSWORD }}
          SOULBROU_KEY_ALIAS: ${{ secrets.SOULBROU_KEY_ALIAS }}
          SOULBROU_KEY_PASSWORD: ${{ secrets.SOULBROU_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx2g

      - name: Instrumented verification on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            ./gradlew :app:connectedDebugAndroidTest --no-daemon -Dorg.gradle.jvmargs=-Xmx2g

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: soulbrou-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG link index
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREVIOUS=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)
          CHANGELOG_FILE="CHANGELOG.md"
          if [ -f "$CHANGELOG_FILE" ]; then
            if [ -n "$PREVIOUS" ]; then
              grep -q "\[${TAG}\]: " "$CHANGELOG_FILE" || printf '\n[%s]: https://github.com/%s/compare/%s...%s\n' \
                "$TAG" "${GITHUB_REPOSITORY}" "$PREVIOUS" "$TAG" >> "$CHANGELOG_FILE"
            else
              grep -q "\[${TAG}\]: " "$CHANGELOG_FILE" || printf '\n[%s]: https://github.com/%s/releases/tag/%s\n' \
                "$TAG" "${GITHUB_REPOSITORY}" "$TAG" >> "$CHANGELOG_FILE"
            fi
            git config user.name "beto2-dev"
            git config user.email "beto2-dev@users.noreply.github.com"
            git add "$CHANGELOG_FILE"
            git commit -m "docs(changelog): add ${TAG} compare link" || true
            git push origin HEAD:main || true
          fi
